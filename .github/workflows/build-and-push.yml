name: Build and Push Docker Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: sirius0xdev

jobs:
  # Discover ALL Dockerfiles recursively (top-level + nested)
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          dockerfiles=$(find . -name 'Dockerfile' -not -path './.git/*' | sed 's|^./||' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix={\"dockerfile\":$dockerfiles}" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '{"dockerfile":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        run: |
          DIR=$(dirname "${{ matrix.dockerfile }}")
          # Path-to-image-name mapping for consistent naming
          # trading-platform/xxx -> trading-xxx
          # paaas -> paaas
          IMG_NAME=$(echo "$DIR" | sed 's|^trading-platform/|trading-|' | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          if [ "$IMG_NAME" = "." ] || [ "$IMG_NAME" = "paaas" ]; then IMG_NAME="paaas"; fi
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "name=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/$IMG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/$IMG_NAME:latest" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/$IMG_NAME:$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tag_latest }},${{ steps.meta.outputs.tag_sha }}
