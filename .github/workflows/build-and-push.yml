name: Build and Push Docker Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: sirius0xdev

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - paaas
          - waitlist-api
          - trade-dashboard
          - trading-platform/data-service
          - trading-platform/news-service
          - trading-platform/execute-service
          - trading-platform/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        run: |
          PROJECT="${{ matrix.project }}"
          if [[ "$PROJECT" == trading-platform/* ]]; then
            IMG_NAME="trading-$(basename "$PROJECT")"
          else
            IMG_NAME="$PROJECT"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "name=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/$IMG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/$IMG_NAME:latest" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/$IMG_NAME:$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.project }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tag_latest }},${{ steps.meta.outputs.tag_sha }}
          build-args: |
            PROJECT=${{ matrix.project }}
