name: Build and Push Docker Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: sirius0xdev

jobs:
  # Discover ALL Dockerfiles recursively (top-level + nested)
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          dirs=""
          while IFS= read -r dockerfile; do
            # Get the directory containing the Dockerfile (relative path minus /Dockerfile)
            dir="${dockerfile%/Dockerfile}"
            if [ -n "$dirs" ]; then
              dirs="$dirs,\"$dir\""
            else
              dirs="\"$dir\""
            fi
          done < <(find . -name 'Dockerfile' -not -path './.git/*' | sed 's|^\./||' | sort)
          echo "matrix={\"project\":[$dirs]}" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '{}' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        run: |
          DIR="${{ matrix.project }}"
          # Path-to-image-name mapping:
          #   trading-platform/execute-service -> trading-execute-service
          #   trading-platform/news-service    -> trading-news-service
          #   trading-platform/data-service    -> trading-data-service
          #   paaas                            -> paaas
          IMG_NAME=$(echo "$DIR" | sed 's|^trading-platform/|trading-|' | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "name=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/$IMG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/$IMG_NAME:latest" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/$IMG_NAME:$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.project }}
          push: true
          tags: ${{ steps.meta.outputs.tag_latest }},${{ steps.meta.outputs.tag_sha }}
