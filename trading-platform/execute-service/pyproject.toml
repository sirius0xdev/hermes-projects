[project]
name = "execute-service"
version = "0.1.0"
description = "Trading execution microservice — Hyperliquid + Solana + Wallet Auth + mTLS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "PyJWT>=2.8",
    "siwe>=2.0",
    "eth-account>=0.13",
    "pynacl>=1.5",
    "base58>=2.1",
    "hyperliquid-python-sdk>=0.23",
    "solana>=0.34",
    "solders>=0.23",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "aiokafka>=0.11",
    "lz4>=4.0",
    "python-snappy>=0.6",
    "protobuf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
