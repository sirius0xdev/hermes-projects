# Build and push container images to GitHub Container Registry (GHCR)
name: Build & Push Images to GHCR

on:
  push:
    branches: [main, develop]
    paths:
      - "trading-platform/**"
      - "!trading-platform/infra/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: sirius0xdev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "tag_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag_branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "tag_latest=${BRANCH}" >> $GITHUB_OUTPUT

      # ---- Execute Service ----
      - name: Build and push execute-service
        uses: docker/build-push-action@v5
        with:
          context: trading-platform/execute-service
          file: trading-platform/infra/dockerfiles/execute-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-execute-service:${{ steps.tags.outputs.tag_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-execute-service:${{ steps.tags.outputs.tag_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- News Service ----
      - name: Build and push news-service
        uses: docker/build-push-action@v5
        with:
          context: trading-platform/news-service
          file: trading-platform/infra/dockerfiles/news-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-news-service:${{ steps.tags.outputs.tag_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-news-service:${{ steps.tags.outputs.tag_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Data Service ----
      - name: Build and push data-service
        uses: docker/build-push-action@v5
        with:
          context: trading-platform/data-service
          file: trading-platform/infra/dockerfiles/data-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-data-service:${{ steps.tags.outputs.tag_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-data-service:${{ steps.tags.outputs.tag_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Dashboard ----
      - name: Build and push dashboard
        uses: docker/build-push-action@v5
        with:
          context: trading-platform/dashboard
          file: trading-platform/infra/dockerfiles/dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-dashboard:${{ steps.tags.outputs.tag_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-dashboard:${{ steps.tags.outputs.tag_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify deployment pipeline
        run: |
          echo "Images pushed successfully with tag ${{ steps.tags.outputs.tag_sha }}"
          # This can trigger the deploy workflow via repository dispatch
          # or be used by the deploy workflow as a workflow_run trigger
