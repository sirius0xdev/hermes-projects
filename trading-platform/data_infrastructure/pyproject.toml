[project]
name = "data-infrastructure"
version = "0.1.0"
description = "Data infrastructure layer — PostgreSQL schema, Redis caching, Kafka pipeline, Protobuf serialization"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",       # redis[asyncio] is built into redis>=5.0
    "aiokafka>=0.11",
    "protobuf>=5.0",
    "grpcio-tools>=1.62",        # For protobuf compilation
    "lz4>=4.3",                  # Kafka compression
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "asyncpg>=0.29",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.21",
    "pyyaml>=6.0.3",
]
