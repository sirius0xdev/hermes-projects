---
apiVersion: v1
kind: Secret
metadata:
  name: execute-service-secret
  namespace: customer1
  labels:
    app: execute-service
    app.kubernetes.io/name: execute-service
type: Opaque
stringData:
  # Database password — override in production via sealed-secret or externalops
  DB_PASSWORD: "change-me-in-production"
  # JWT signing secret — must be at least 32 bytes of random data
  JWT_SECRET_KEY: "replace-with-32-byte-random-value"
