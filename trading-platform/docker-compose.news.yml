---
version: "3.8"

services:
  news-service:
    build: ./news-service
    container_name: news-analyst
    ports:
      - "8003:8000"
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_HOST: ${DB_HOST:-customer1-cnpg}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-news}
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka1:9092}
      KAFKA_GROUP_ID: news-analyzer
      KAFKA_TOPIC_ARTICLES: news.articles
      KAFKA_TOPIC_ANALYSIS: news.analysis
      API_PREFIX: /api/v1
      CORS_ORIGINS: '["*"]'
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
    restart: unless-stopped
    networks:
      - trading-platform

networks:
  trading-platform:
    external: true
