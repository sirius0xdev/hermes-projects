[project]
name = "data-service"
version = "0.1.0"
description = "Data service — PostgreSQL schema, async DB config, Alembic migrations, Kafka streaming"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "kafka-python-ng>=2.2",
    "httpx>=0.27",
    "redis[hiredis]>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools]
packages.find = {where = ["."], include = ["data_service*"]}

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
