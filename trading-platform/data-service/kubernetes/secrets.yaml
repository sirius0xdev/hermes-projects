---
apiVersion: v1
kind: Secret
metadata:
  name: trading-data-secrets
  namespace: customer1
  labels:
    app: trading-data
type: Opaque
# Values are base64-encoded. In production, use External Secrets Operator
# or GCP Secret Manager CSI driver instead of inline secrets.
# IMPORTANT: Replace placeholder values (YmFzZTY0LXBsYWNlaG9sZGVy) with real base64-encoded secrets.
data:
  POSTGRES_USER: YmFzZTY0LXBsYWNlaG9sZGVy                    # placeholder
  POSTGRES_PASSWORD: YmFzZTY0LXBsYWNlaG9sZGVy                    # placeholder
  REDIS_PASSWORD: YmFzZTY0LXBsYWNlaG9sZGVr                 # placeholder
  KAFKA_SASL_JAAS_CONFIG: ""                   # optional, empty for PLAINTEXT
  # Connection URLs (constructed from individual components)
  DATABASE_URL: YmFzZTY0LXBsYWNlaG9sZGVy  # placeholder
  REDIS_URL: YmFzZTY0LXBsYWNlaG9sZGVy==  # placeholder
