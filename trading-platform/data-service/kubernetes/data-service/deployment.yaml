---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service-ingester
  namespace: customer1
  labels:
    app: data-service
    component: ingester
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-service
      component: ingester
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: data-service
        component: ingester
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-kafka
          image: bitnami/kafka:3.7.0
          command:
            - sh
            - -c
            - |
              until kafka-topics.sh --bootstrap-server kafka.customer1.svc.cluster.local:9092 --list > /dev/null 2>&1; do
                echo "Waiting for Kafka..."
                sleep 5
              done
              echo "Kafka is ready"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 0
      containers:
        - name: ingester
          image: ghcr.io/sirius0xdev/trading-data-service:latest
          command: ["python", "-m", "data_service.app.kafka.ingester"]
          env:
            # Kafka
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.customer1.svc.cluster.local:9092"
            - name: KAFKA_CLIENT_ID
              value: "data-service-ingester"

            # Ingestion config
            - name: INGEST_SYMBOLS
              valueFrom:
                configMapKeyRef:
                  name: trading-data-config
                  key: INGEST_SYMBOLS
            - name: INGEST_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: trading-data-config
                  key: INGEST_INTERVAL_SECONDS
            - name: INGEST_MAX_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: trading-data-config
                  key: INGEST_MAX_RETRIES

            # Logging
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: trading-data-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service-consumer
  namespace: customer1
  labels:
    app: data-service
    component: consumer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data-service
      component: consumer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: data-service
        component: consumer
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-kafka
          image: bitnami/kafka:3.7.0
          command:
            - sh
            - -c
            - |
              until kafka-topics.sh --bootstrap-server kafka.customer1.svc.cluster.local:9092 --list > /dev/null 2>&1; do
                echo "Waiting for Kafka..."
                sleep 5
              done
              echo "Kafka is ready"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: consumer
          image: ghcr.io/sirius0xdev/trading-data-service:latest
          command: ["python", "-m", "data_service.app.kafka.consumer_service"]
          env:
            # Kafka
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.customer1.svc.cluster.local:9092"
            - name: KAFKA_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: trading-data-config
                  key: KAFKA_GROUP_ID
            - name: KAFKA_AUTO_OFFSET_RESET
              valueFrom:
                configMapKeyRef:
                  name: trading-data-config
                  key: KAFKA_AUTO_OFFSET_RESET

            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trading-data-secrets
                  key: DATABASE_URL
            - name: DB_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: trading-data-config
                  key: DB_POOL_SIZE

            # Redis
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: trading-data-secrets
                  key: REDIS_URL

            # Topics to consume (comma-separated)
            - name: CONSUME_TOPICS
              valueFrom:
                configMapKeyRef:
                  name: trading-data-config
                  key: CONSUME_TOPICS

            # Logging
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: trading-data-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
