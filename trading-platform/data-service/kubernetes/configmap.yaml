---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-data-config
  namespace: customer1
  labels:
    app: trading-data
data:
  # PostgreSQL
  POSTGRES_DB: "trading_db"
  PGPORT: "5432"

  # Redis
  REDIS_MAXMEMORY: "256mb"
  REDIS_MAXMEMORY_POLICY: "allkeys-lru"

  # Kafka
  KAFKA_CLUSTER_ID: "MkU3OEVBNTcwT0FBQT0="
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_LOG_RETENTION_HOURS: "24"
  KAFKA_LOG_SEGMENT_BYTES: "1073741824"

  # Connection Pooling (app-level defaults)
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  DB_POOL_RECYCLE: "300"
  DB_POOL_PRE_PING: "true"

  # Data service configuration
  INGEST_SYMBOLS: "BTC-USD,ETH-USD,SPY,AAPL,TSLA"
  INGEST_INTERVAL_SECONDS: "60"
  INGEST_MAX_RETRIES: "3"

  # Consumer configuration
  KAFKA_GROUP_ID: "data-service-consumer"
  KAFKA_AUTO_OFFSET_RESET: "latest"
  CONSUME_TOPICS: "trading-platform.market.prices.v1,trading-platform.market.orderbook.v1,trading-platform.market.trades.v1,trading-platform.news.feed.v1,trading-platform.news.analysis.v1"

  # Logging
  LOG_LEVEL: "INFO"
