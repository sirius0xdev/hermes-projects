apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: landscaping-business-route
  namespace: landscaping-business
spec:
  parentRefs:
  - name: external-http-gateway
    namespace: customer1
  hostnames:
  - "landscaping-business.siriusdevops.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: landscaping-business-svc
      port: 80
