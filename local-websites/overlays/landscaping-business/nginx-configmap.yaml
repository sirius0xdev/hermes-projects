apiVersion: v1
kind: ConfigMap
metadata:
  name: landscaping-business-nginx-config
  namespace: landscaping-business
data:
  default.conf: |
    server {
        listen 80;
        server_name landscaping-business.siriusdevops.com *.landscaping-business.siriusdevops.com;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gzip
        gzip on;
        gzip_types text/html text/css application/javascript;
        gzip_min_length 256;
    }
