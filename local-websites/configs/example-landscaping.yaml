# Local Business Website Configuration
# One config file = one deployed website on the cluster
# Run: python scripts/generate.py configs/this-file.yaml
# Then: python scripts/deploy.py overlays/<business-name>

business:
  name: landscaping-business          # kebab-case, used for K8s resource names & subdomain
  namespace: landscaping-business     # K8s namespace
  domain_base: siriusdevops.com       # parent domain (subdomain = name + domain_base)
  title: "Premier Landscaping Services"
  tagline: "Making your outdoors beautiful since 2010"
  phone: "(555) 123-4567"
  email: "info@green-scape.com"
  address: "123 Green Street, Springfield, IL 62701"
  colors:
    primary: "#2E7D32"
    secondary: "#F5F5F5"
    accent: "#FF6F00"
    text: "#333333"
  logo_text: "GreenScape"

pages:
  home:
    hero:
      headline: "Transform Your Outdoor Space"
      subheadline: "Professional landscaping and lawn care for homes and businesses across Springfield"
      cta: "Get a Free Quote"
    sections:
      - type: services
        title: "Our Services"
        items:
          - title: "Lawn Care"
            description: "Weekly mowing, trimming, edging, and seasonal maintenance to keep your lawn pristine year-round."
            icon: "🌿"
          - title: "Garden Design"
            description: "Custom garden layouts, native plant selection, and perennial beds tailored to your property."
            icon: "🌸"
          - title: "Hardscaping"
            description: "Patios, walkways, retaining walls, and outdoor living spaces built with quality materials."
            icon: "🧱"
          - title: "Tree & Shrub Care"
            description: "Pruning, removal, disease treatment, and planting for healthy, beautiful trees."
            icon: "🌳"
          - title: "Irrigation Systems"
            description: "Design, installation, and repair of sprinkler and drip irrigation systems."
            icon: "💧"
          - title: "Seasonal Cleanup"
            description: "Spring and fall cleanup, leaf removal, mulching, and winter preparation."
            icon: "🍂"
      - type: about
        title: "About Us"
        content: "GreenScape has been Springfield's trusted landscaping partner since 2010. We're a family-owned business that takes pride in transforming outdoor spaces with craftsmanship, creativity, and care. Our team of certified professionals brings over 50 years of combined experience — we treat every property like it's our own."
      - type: contact
        title: "Get In Touch"
        show_phone: true
        show_email: true
        show_address: true
        show_hours: true
        hours:
          monday: "8:00 AM – 6:00 PM"
          tuesday: "8:00 AM – 6:00 PM"
          wednesday: "8:00 AM – 6:00 PM"
          thursday: "8:00 AM – 6:00 PM"
          friday: "8:00 AM – 6:00 PM"
          saturday: "9:00 AM – 3:00 PM"
          sunday: "Closed"
